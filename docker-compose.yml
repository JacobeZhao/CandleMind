services:
  backend:
    build: ./backend
    container_name: binance_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: binance_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
