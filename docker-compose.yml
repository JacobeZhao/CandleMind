services:
  backend:
    build: ./backend
    container_name: binance_backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: ${CANDLEMIND_DATA_ROOT:-G:/CandleMind/CandleMind_data}
        target: /app/market-data
        read_only: true
      - type: bind
        source: ${CANDLEMIND_RUNTIME_ROOT:-G:/CandleMind/CandleMind_data/runtime/app}
        target: /app/runtime
    environment:
      - MARKET_DATA_DIR=/app/market-data
      - DATA_DIR=/app/runtime
      - PYTHONUNBUFFERED=1
      - CANDLEMIND_AI_BASE_URL_HOSTS=${CANDLEMIND_AI_BASE_URL_HOSTS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: binance_frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: unless-stopped
